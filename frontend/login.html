<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | FoodHub</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="nav"><a class="brand" href="index.html">FoodHub</a></nav><main class="wrap"><div class="panel form"><h1>Welcome back 👋</h1><p class="muted">Login to continue your order.</p><form id="f"><input class="input" id="email" type="email" placeholder="Email" required><input class="input" id="password" type="password" placeholder="Password" required><button class="btn primary" style="width:100%">Login</button></form><p>New here? <a href="register.html" style="color:#ff5a36">Create account</a></p><p id="msg" class="muted"></p></div></main><script src="js/config.js"></script><script src="js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{saveSession(await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})}));location.href='index.html'}catch(x){msg.textContent=x.message}}</script></body></html>
