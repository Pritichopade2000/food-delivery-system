<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | FoodHub</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="nav"><a class="brand" href="index.html">FoodHub</a></nav><main class="wrap"><div class="panel form"><h1>Create your account</h1><form id="f"><input class="input" id="name" placeholder="Full name" required><input class="input" id="email" type="email" placeholder="Email" required><input class="input" id="phone" placeholder="Phone"><input class="input" id="address" placeholder="Delivery address"><input class="input" id="password" type="password" placeholder="Password" required><button class="btn primary" style="width:100%">Create account</button></form><p>Already have an account? <a href="login.html" style="color:#ff5a36">Login</a></p><p id="msg" class="muted"></p></div></main><script src="js/config.js"></script><script src="js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{saveSession(await api('/auth/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:password.value,phone:phone.value,address:address.value})}));location.href='index.html'}catch(x){msg.textContent=x.message}}</script></body></html>
